{% extends 'base.html' %}{% block title %}Books{% endblock %}{% block content %}
<div class="container-fluid py-3"><form class="row g-2 mb-4"><div class="col-md-6"><input name="q" value="{{q}}" class="form-control" placeholder="Search title, author or ISBN"></div>
<div class="col-md-4"><select name="cat" class="form-select"><option value="">All categories</option>{% for c in cats %}<option value="{{c.id}}" {{'selected' if cat==c.id|string}}>{{c.name}}</option>{% endfor %}</select></div>
<div class="col-md-2"><button class="btn btn-purple w-100"><i class="fa fa-search"></i> Search</button></div></form>
<div class="row g-3">{% for b in books %}{% include '_card.html' %}{% else %}<p class="text-muted">No books found.</p>{% endfor %}</div></div>{% endblock %}
