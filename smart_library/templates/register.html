{% extends 'base.html' %}{% block title %}Register{% endblock %}{% block content %}
<div class="container py-5" style="max-width:480px"><h3 class="text-purple">Student Registration</h3>
<form method="post"><input name="name" class="form-control mb-3" placeholder="Full name" required><input name="email" type="email" class="form-control mb-3" placeholder="Email" required>
<input name="roll_no" class="form-control mb-3" placeholder="Roll number" required><input name="password" type="password" minlength="6" class="form-control mb-3" placeholder="Password (min 6)" required>
<p class="mb-1">Interests (used for recommendations):</p>{% for c in cats %}<div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" name="interests" value="{{c.name}}" id="c{{c.id}}"><label class="form-check-label" for="c{{c.id}}">{{c.name}}</label></div>{% endfor %}
<button class="btn btn-purple w-100 mt-3">Register</button></form></div>{% endblock %}
