<div class="col-6 col-md-4 col-lg-3"><div class="card book-card h-100">
<img src="{{ b.cover_url or 'https://covers.openlibrary.org/b/isbn/'~b.isbn~'-M.jpg?default=false' }}" class="card-img-top" alt="cover" onerror="this.onerror=null;this.src='https://placehold.co/300x420/6f42c1/ffffff?text=Book'">
<div class="card-body"><span class="badge bg-purple">{{b.cat}}</span><h6 class="mt-2">{{b.title}}</h6><small class="text-muted">{{b.author}}</small>
<div class="small mt-1">{{b.available_copies}}/{{b.total_copies}} available</div>
{% if session.role=='student' %}{% if b.available_copies>0 %}<form method="post" action="{{url_for('request_book',id=b.id)}}"><button class="btn btn-sm btn-purple w-100 mt-2">Request</button></form>
{% else %}<button class="btn btn-sm btn-secondary w-100 mt-2" disabled>Unavailable</button>{% endif %}
{% elif session.role %}<div class="d-flex gap-1 mt-2"><a class="btn btn-sm btn-outline-primary flex-fill" href="{{url_for('book_save',id=b.id)}}">Edit</a>
<form method="post" class="flex-fill" data-confirm="Delete this book?" action="{{url_for('book_delete',id=b.id)}}"><button class="btn btn-sm btn-outline-danger w-100">Delete</button></form></div>{% endif %}
</div></div></div>
